server:
  port: 8086
  forward-headers-strategy: framework

spring:
  application:
    name: investments-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financialapp?currentSchema=investments}
    username: ${DB_USERNAME:financialapp}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: investments
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    schemas: investments
    default-schema: investments
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

iol:
  base-url: ${IOL_BASE_URL:https://api.invertironline.com}
  username: ${IOL_USERNAME:}
  password: ${IOL_PASSWORD:}
  price-refresh-cron: ${IOL_PRICE_REFRESH_CRON:0 */15 10-17 * * MON-FRI}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
