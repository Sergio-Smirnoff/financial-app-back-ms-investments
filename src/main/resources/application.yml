server:
  port: 8086
  forward-headers-strategy: framework

spring:
  application:
    name: investments-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financialapp?currentSchema=investments}
    username: ${DB_USERNAME:financialapp}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: investments
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    schemas: investments
    default-schema: investments
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: investments-group

investments:
  currencies:
    # Whitelist of ISO 4217 codes accepted on inbound holdings.
    supported: [ARS, USD, EUR]
  integration:
    finances-category-id: ${INVEST_FINANCES_CATEGORY_ID:12}
    broker-cbu:
      ARS: ${INVEST_BROKER_CBU_ARS:9990009000000000000001}
      USD: ${INVEST_BROKER_CBU_USD:9990009000000000000002}
      EUR: ${INVEST_BROKER_CBU_EUR:9990009000000000000003}

iol:
  base-url: ${IOL_BASE_URL:https://api.invertironline.com}
  username: ${IOL_USERNAME:?IOL_USERNAME must be set}
  password: ${IOL_PASSWORD:?IOL_PASSWORD must be set}
  price-refresh-cron: ${IOL_PRICE_REFRESH_CRON:0 */15 10-17 * * MON-FRI}

finances:
  service:
    url: ${FINANCES_SERVICE_URL:http://localhost:8082}

internal:
  auth:
    token: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN must be set}

resilience4j:
  retry:
    instances:
      iolApi:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.RestClientException
  circuitbreaker:
    instances:
      iolApi:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
